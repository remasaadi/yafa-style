<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            color: #333;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            margin: 10px 0;
            transition: background-color 0.3s;
        }

            .button:hover {
                background-color: #0056b3;
            }

        .container {
            max-width: 600px;
            margin: auto;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome, {{ user.first_name }}!</h1>
        <a href="{{ url_for('views.add_client') }}" class="button">Add Client</a><br>
        <a href="{{ url_for('views.add_transaction') }}" class="button">Add Transaction</a><br>
        <a href="{{ url_for('views.use_points') }}" class="button">Use Points</a><br>
        <a href="{{ url_for('views.check_points') }}" class="button">Check Points</a><br>
        <a href="{{ url_for('views.logout') }}" class="button">Logout</a><br>
    </div>
</body>

</html>
